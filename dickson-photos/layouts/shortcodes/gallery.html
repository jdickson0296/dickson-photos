{{ $images := (.Page.Resources.ByType "image") }}

<!-- PhotoSwipe v5 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.css">
<script type="module">
import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe-lightbox.esm.min.js';
const lightbox = new PhotoSwipeLightbox({
  gallery: '#gallery-{{ .Page.File.UniqueID }}',
  children: 'a',
  pswpModule: () => import('https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.esm.min.js'),
  showHideAnimationType: 'zoom',
  imageClickAction: 'next',
  tapAction: 'next',
});
lightbox.init();
</script>

<div id="gallery-{{ .Page.File.UniqueID }}" class="dp-gallery">
{{ range $images }}
  {{ $full  := .Fit "2000x2000 q90 webp" }}
  {{ $thumb := .Fit "1000x1000 q85 webp" }}
  {{ $isPortrait := gt .Height .Width }}
  <a href="{{ $full.RelPermalink }}"
     data-pswp-width="{{ $full.Width }}"
     data-pswp-height="{{ $full.Height }}"
     {{ with .Exif }}{{ with .Tags.ImageDescription }}data-pswp-caption="{{ . }}"{{ end }}{{ end }}
     class="dp-gallery__item{{ if $isPortrait }} dp-gallery__item--portrait{{ end }}"
     target="_blank">
    <img src="{{ $thumb.RelPermalink }}"
         alt="{{ with .Exif }}{{ .Tags.ImageDescription }}{{ end }}"
         loading="lazy" />
  </a>
{{ end }}
</div>

<style>
.dp-gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-auto-rows: 280px;
  gap: 8px;
  margin: 1.5rem 0;
}

/* Portrait images span 2 rows so they get proportional vertical space */
.dp-gallery__item--portrait {
  grid-row: span 2;
}

.dp-gallery__item {
  display: block;
  overflow: hidden;
  border-radius: 4px;
}

.dp-gallery__item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
  margin: 0;
  transition: transform 0.35s ease, opacity 0.35s ease;
}

.dp-gallery__item:hover img {
  transform: scale(1.03);
  opacity: 0.88;
}

@media (max-width: 480px) {
  .dp-gallery {
    grid-template-columns: 1fr;
    grid-auto-rows: 320px;
  }
  .dp-gallery__item--portrait {
    grid-row: span 2;
  }
}
</style>
